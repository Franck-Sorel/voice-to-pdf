name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # Manual build: `Assemble signed release APK` + signature/size verification
  # without publishing (publishing still requires a v* tag).
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with whisper.cpp submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run unit tests
        run: ./gradlew test

      - name: Lint
        run: ./gradlew lintDebug

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Check debug APK size budget (<= 100 MB)
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk 2>/dev/null | head -n1)
          if [ -f "$APK" ]; then
            SIZE=$(stat -c%s "$APK")
            echo "APK size: $((SIZE / 1024 / 1024)) MB ($SIZE bytes)"
            test "$SIZE" -le $((100 * 1024 * 1024))
          else
            echo "No debug APK produced; skipping size check."
          fi

  # Signed release APK. Assembles + verifies on any trigger; publishes as a
  # GitHub Release only on v* tags with the keystore secrets configured
  # (see docs/SETUP.md §3).
  release:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed only to publish the GitHub Release
    steps:
      - name: Checkout (with whisper.cpp submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Write keystore from secrets
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$PWD/release.keystore"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$PWD/release.keystore" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" \
            > keystore.properties

      - name: Assemble release APK
        run: ./gradlew assembleRelease

      - name: Verify APK signature
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort | tail -1)
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          echo "Verifying $APK"
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Check release APK size budget (<= 100 MB)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          SIZE=$(stat -c%s "$APK")
          echo "Release APK: $((SIZE / 1024 / 1024)) MB ($SIZE bytes)"
          test "$SIZE" -le $((100 * 1024 * 1024))

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') && secrets.KEYSTORE_BASE64 != ''
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          draft: true
