name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: gradle/wrapper-validation-action@v3
      - uses: ./.github/actions/android-toolchain
      - name: JVM unit tests (gradle warnings fail)
        run: ./gradlew test --warning-mode=fail

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: gradle/wrapper-validation-action@v3
      - uses: ./.github/actions/android-toolchain
      - name: Android lint (warnings are errors)
        run: ./gradlew lintDebug --warning-mode=fail

  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: gradle/wrapper-validation-action@v3
      - uses: ./.github/actions/android-toolchain
      - name: Build debug APK
        run: ./gradlew assembleDebug --warning-mode=fail
      - name: Build release APK
        # Separate invocation on purpose: running both variants in one Gradle
        # build races on the Room schema export file (kspDebug/kspRelease).
        run: ./gradlew assembleRelease --warning-mode=fail
      - name: Native lib + ABI audit
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          test -n "$APK"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libwhisper.so' || { echo "::error::libwhisper.so (arm64) missing"; exit 1; }
          if unzip -l "$APK" | grep -Eq 'lib/(x86_64|armeabi-v7a)/'; then
            echo "::error::unexpected ABI in release APK"; exit 1
          fi
      - name: Size sanity (full bundled-budget gate runs at release)
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          SIZE=$(stat -c%s "$APK")
          echo "release APK (no model in CI): $SIZE bytes"
          test "$SIZE" -le $((100 * 1024 * 1024))
