name: Firebase Test Lab (physical arm64)

# Runs on-device instrumented tests on real arm64 Pixel hardware (our APK is
# arm64-v8a-only; an x86_64 CI emulator cannot install it — see docs/TESTING.md).
#
# This job is a NO-OP (never fails) unless ALL of these are configured, so a
# fork — or a repo in the "will set it up later" state — stays green:
#   1. repository VARIABLE  RUN_FIREBASE = true
#   2. secrets FIREBASE_SERVICE_ACCOUNT (RAW JSON, not base64) + FIREBASE_PROJECT_ID
#   3. (for results) a GCS bucket — set FIREBASE_RESULTS_BUCKET. NOTE: since
#      Feb 2026 creating a Cloud Storage bucket (incl. Firebase's default)
#      requires the paid Blaze plan; on the free Spark plan this stage must
#      remain OFF. If you add a bucket later, re-enable RUN_FIREBASE.
# Enable steps: docs/SETUP.md §8.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firebase-test-lab:
    if: vars.RUN_FIREBASE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Check Firebase configured (var is set but secrets may be missing)
        id: fbc
        env:
          HAS_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
          HAS_PID: ${{ secrets.FIREBASE_PROJECT_ID != '' }}
        run: |
          if [ "$HAS_SA" = "true" ] && [ "$HAS_PID" = "true" ]; then
            echo "configured=true"
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::RUN_FIREBASE=true but Firebase secrets not set; skipping."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/android-toolchain
        if: steps.fbc.outputs.configured == 'true'

      - name: Build app + instrumented test APKs
        if: steps.fbc.outputs.configured == 'true'
        run: ./gradlew assembleDebug assembleAndroidTest --warning-mode=fail

      - name: Authenticate to Google Cloud
        if: steps.fbc.outputs.configured == 'true'
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        if: steps.fbc.outputs.configured == 'true'
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ secrets.FIREBASE_PROJECT_ID }}

      - name: Run instrumentation tests on physical arm64 devices
        if: steps.fbc.outputs.configured == 'true'
        env:
          RESULTS_BUCKET: ${{ secrets.FIREBASE_RESULTS_BUCKET }}
        run: |
          BUCKET_FLAG=""
          if [ -n "$RESULTS_BUCKET" ]; then
            BUCKET_FLAG="--results-bucket=$RESULTS_BUCKET"
          fi
          # gcloud returns a non-zero exit code on any failed/inconclusive run.
          gcloud firebase test android run \
            --type instrumentation \
            --app app/build/outputs/apk/debug/app-debug.apk \
            --test app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk \
            --device model=shiba,version=34,locale=en,orientation=portrait \
            --device model=panther,version=33,locale=en,orientation=portrait \
            --device model=oriole,version=33,locale=en,orientation=portrait \
            ${BUCKET_FLAG} \
            --results-dir=testlab/${{ github.run_id }} \
            --results-history-name="STT-app CI" \
            --timeout 20m
