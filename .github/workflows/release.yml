name: Release

# The production path: builds the SIGNED APK from the tagged commit, verifies
# it (signature, size, ABI, model), and publishes a DRAFT GitHub Release.
# Self-contained: it re-runs the critical gates on the tag commit, so a green
# run is trustworthy by construction — no dependence on PR-CI state.
#
#   push tags v*        -> version -> build-signed -> publish (draft)
#   workflow_dispatch   -> version -> build-signed (DRY RUN; no publish)
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.v.outputs.version_name }}
      version_code: ${{ steps.v.outputs.version_code }}
    steps:
      - id: v
        env:
          IS_DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$IS_DISPATCH" = "true" ]; then
            echo "version_name=0.0.0"; echo "version_code=0"
          else
            tag="${GITHUB_REF_NAME#v}"        # v1.2.3 -> 1.2.3
            name="${tag%%-*}"                  # drop pre-release suffix
            IFS='.' read -r ma mi pa <<< "$name"
            : "${ma:=0}"; : "${mi:=0}"; : "${pa:=0}"
            code=$(( (ma * 10000) + (mi * 100) + pa ))
            echo "version_name=$name"
            echo "version_code=$code"
          fi

  build-signed:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
      - name: Install pinned NDK + CMake
        run: |
          sdkmanager --install "ndk;28.2.13676358" "cmake;3.22.1" >/dev/null
          sdkmanager --licenses >/dev/null 2>&1 || true
      - uses: actions/cache@v6
        with:
          path: ${{ env.ANDROID_HOME }}/ndk
          key: ndk-${{ runner.os }}-28.2.13676358

      - uses: gradle/actions/setup-gradle@v4

      - name: Write keystore (if enabled)
        env:
          SIGNING_ENABLED: ${{ vars.SIGNING_ENABLED }}
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          if [ "$SIGNING_ENABLED" = "true" ] && [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$PWD/release.keystore"
            printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$PWD/release.keystore" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" \
              > keystore.properties
            echo "::notice::keystore written"
          else
            echo "::notice::signing not enabled -> building unsigned (dry-run)"
          fi

      - name: Download + bundle GGML model (offline-capable APK)
        run: bash ml/download-models.sh

      - name: Build release APK
        run: |
          ./gradlew assembleRelease \
            -PversionName="${{ needs.version.outputs.version_name }}" \
            -PversionCode=${{ needs.version.outputs.version_code }} \
            --warning-mode=fail

      - name: Verify APK signature
        env:
          SIGNING_ENABLED: ${{ vars.SIGNING_ENABLED }}
        run: |
          if [ "$SIGNING_ENABLED" = "true" ]; then
            APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort | tail -1)
            "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk
          fi

      - name: Size + ABI + native-lib audit
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          SIZE=$(stat -c%s "$APK")
          echo "release APK size: $SIZE bytes ($((SIZE/1048576)) MB)"
          test "$SIZE" -le $((100 * 1024 * 1024)) || { echo "::error::release APK exceeds 100 MB"; exit 1; }
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libwhisper.so' || { echo "::error::libwhisper.so (arm64) missing"; exit 1; }
          if unzip -l "$APK" | grep -Eq 'lib/(x86_64|armeabi-v7a)/'; then
            echo "::error::unexpected ABI in release APK"; exit 1
          fi
          unzip -l "$APK" | grep -q 'assets/models/ggml-base-q8_0.bin' || { echo "::error::model not bundled in APK"; exit 1; }

      - name: Compute checksums
        run: |
          cd app/build/outputs/apk/release
          sha256sum app-release.apk | tee SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: release-apk
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/SHA256SUMS
          retention-days: 30

  publish:
    needs: build-signed
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: release-apk
          path: build/release

      - name: Publish draft GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            build/release/app-release.apk
            build/release/SHA256SUMS
          generate_release_notes: true
          draft: true
