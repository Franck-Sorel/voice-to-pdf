# Path -> label mapping for actions/labeler (see pr-labeler.yml).
core:
  - changed-files:
      - any-glob-to-any-file: 'app/src/main/java/com/sttapp/core/**'
data:
  - changed-files:
      - any-glob-to-any-file: 'app/src/main/java/com/sttapp/data/**'
ui:
  - changed-files:
      - any-glob-to-any-file: 'app/src/main/java/com/sttapp/ui/**'
native:
  - changed-files:
      - any-glob-to-any-file: 'app/src/main/cpp/**'
ml:
  - changed-files:
      - any-glob-to-any-file: 'ml/**'
docs:
  - changed-files:
      - any-glob-to-any-file: 'docs/**'
ci:
  - changed-files:
      - any-glob-to-any-file: '.github/**'
kotlin:
  - changed-files:
      - any-glob-to-any-file: '**/*.kt'
