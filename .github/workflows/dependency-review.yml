name: Dependency Review

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Scan changed dependencies
        # Enforces advisory/severity limits on dependency changes (e.g.
        # dependabot PRs). Fails the PR on high-severity advisories.
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
