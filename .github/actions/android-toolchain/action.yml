name: Android toolchain
description: JDK 17 + Android SDK + pinned NDK/CMake + Gradle, combined (single source of truth).
inputs: {}
runs:
  using: composite
  steps:
    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '17'

    - uses: android-actions/setup-android@v4

    - name: Install pinned SDK platform, build-tools, NDK, CMake
      shell: bash
      run: |
        sdkmanager --install \
          "platform-tools" \
          "platforms;android-37" \
          "build-tools;37.0.0" \
          "ndk;28.2.13676358" \
          "cmake;3.22.1" >/dev/null || true
        sdkmanager --licenses >/dev/null 2>&1 || true

    - uses: actions/cache@v6
      with:
        path: ${{ env.ANDROID_HOME }}/ndk
        key: ndk-${{ runner.os }}-28.2.13676358

    - uses: gradle/actions/setup-gradle@v4
      with:
        # Prevent forks/PRs from writing to the shared cache (cache poisoning).
        cache-read-only: ${{ github.ref != 'refs/heads/main' }}
