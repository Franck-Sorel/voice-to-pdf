name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew test

      - name: Lint
        run: ./gradlew lintDebug

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      # Online coverage is a follow-up; today we only assert the APK stays
      # under the deployable size ceiling (see docs/NFR.md §2). The model is
      # not bundled yet, so this is trivially green until M1 wires sherpa-onnx.
      - name: Check debug APK size budget (<= 100 MB)
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk 2>/dev/null | head -n1)
          if [ -f "$APK" ]; then
            SIZE=$(stat -c%s "$APK")
            echo "APK size: $((SIZE / 1024 / 1024)) MB ($SIZE bytes)"
            test "$SIZE" -le $((100 * 1024 * 1024))
          else
            echo "No debug APK produced; skipping size check."
          fi

  # Signed release APK published as a GitHub Release asset. Runs only on v*
  # tags and only if the keystore secrets are configured (see SETUP.md §3).
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Write keystore from secrets
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::KEYSTORE_BASE64 secret not set; skipping signing."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$PWD/release.keystore"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$PWD/release.keystore" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" \
            > keystore.properties

      - name: Assemble signed release APK
        run: ./gradlew assembleRelease

      - name: Check release APK size budget (<= 100 MB)
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          SIZE=$(stat -c%s "$APK")
          echo "Release APK: $((SIZE / 1024 / 1024)) MB ($SIZE bytes)"
          test "$SIZE" -le $((100 * 1024 * 1024))

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          draft: true
